[package]
name = "emtasks"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A quiet Eisenhower-matrix task organizer for macOS"
publish = false

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
ron = "0.8"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
