name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14 # Apple Silicon, same as the release target
    defaults:
      run:
        working-directory: emtasks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emtasks
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
