<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emTasks</title>
<meta name="description" content="A quiet to-do app for Mac that sorts your tasks by what's urgent and what's important. Free, offline and private.">
<meta property="og:title" content="emTasks">
<meta property="og:description" content="A quiet to-do app for Mac. Free, offline and private.">
<meta property="og:image" content="https://binu-alexander.github.io/emtasks/screenshots/matrix-light.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #1d1d1f; --accent-text: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --text: #f2f2f4; --muted: #9a9aa1; --line: #2a2b2f; --accent: #f2f2f4; --accent-text: #111214; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 960px; margin: 0 auto; padding: 72px 20px 40px; text-align: center; }
  .logo { width: 88px; height: 88px; }
  h1 { font-size: 40px; font-weight: 650; letter-spacing: -0.02em; margin: 14px 0 8px; }
  p { color: var(--muted); margin: 0 auto; max-width: 520px; }
  .btn {
    display: inline-block; margin-top: 28px; padding: 11px 24px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; font-size: 16px;
  }
  .small { font-size: 14px; margin-top: 12px; }
  .small a { color: var(--muted); }
  img.shot { display: block; width: 100%; height: auto; margin: 48px auto 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 20px 48px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.png" alt="emTasks logo">
  <h1>emTasks</h1>
  <p>A quiet to-do app for Mac that sorts your tasks by what's urgent and what's important.</p>
  <a class="btn" href="https://github.com/binu-alexander/emtasks/releases/latest">Download for Mac</a>
  <p class="small">Free · Offline · No account · macOS 11+ on Apple Silicon · <a href="https://github.com/binu-alexander/emtasks#install">Install help</a></p>
  <picture>
    <source srcset="screenshots/matrix-dark.png" media="(prefers-color-scheme: dark)">
    <img class="shot" src="screenshots/matrix-light.png" width="1600" height="1122" alt="emTasks with tasks sorted into the four quadrants of the Eisenhower matrix">
  </picture>
</main>
<footer>
  by B. Alexander · <a href="https://github.com/binu-alexander/emtasks">GitHub</a> · MIT
</footer>
</body>
</html>
